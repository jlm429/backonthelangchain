[project]
name = "backonthelangchain"
version = "0.1.0"
description = "Observable prototype for RAG, routing, safety, and LangGraph support flows."
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "python-dotenv",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

rag = [
    "langchain-community",
    "faiss-cpu",
    "voyageai",
    "llama-index-core",
    "numpy>=1.26,<2.3",
]

jev = [
    "typesafe-sdk",
]

notebooks = [
    "jupyter",
    "ipykernel",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
